<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voti - Registro Elettronico</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/dati.js"></script>
    <script defer src="js/validazione.js"></script>
    <script defer src="js/common.js"></script>
    <script defer src="js/voti.js"></script>
</head>
<body>
    <header class="topbar">
        <span class="brand">Registro Elettronico</span>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="studenti.html">Studenti</a>
            <a href="voti.html" class="attivo">Voti</a>
        </nav>
        <div class="utente">
            <span id="nomeUtente"></span>
            <button class="btn btn-secondario piccolo" onclick="logout()">Esci</button>
        </div>
    </header>

    <main>
        <h1>Voti</h1>

        <section class="pannello">
            <h2>Nuovo voto</h2>
            <div class="griglia-form">
                <div class="campo">
                    <label for="selStudente">Studente</label>
                    <select id="selStudente" name="studente"></select>
                </div>
                <div class="campo">
                    <label for="selMateria">Materia</label>
                    <select id="selMateria" name="materia"></select>
                </div>
                <div class="campo">
                    <label for="selTipo">Tipo di verifica</label>
                    <select id="selTipo" name="tipo"></select>
                </div>
                <div class="campo">
                    <label for="voto">Voto (1-10)</label>
                    <input type="number" id="voto" name="voto" min="1" max="10" step="0.25">
                </div>
                <div class="campo">
                    <label for="dataVoto">Data</label>
                    <input type="date" id="dataVoto" name="dataVoto">
                </div>
            </div>
            <div class="azioni">
                <button class="btn" onclick="salvaVoto()">Registra voto</button>
            </div>
            <div id="messaggi" class="messaggi"></div>
        </section>

        <section class="pannello">
            <h2>Registro dei voti</h2>
            <div class="barra-filtro">
                <div class="campo">
                    <label for="filtroStudente">Mostra i voti di</label>
                    <select id="filtroStudente" onchange="disegnaTabella()"></select>
                </div>
                <div class="media">Media: <span id="media" class="voto">-</span></div>
            </div>
            <div class="scroll-tabella">
                <table>
                    <thead>
                        <tr><th>Data</th><th>Studente</th><th>Materia</th><th>Tipo</th><th>Voto</th><th>Azioni</th></tr>
                    </thead>
                    <tbody id="corpoTabella"></tbody>
                </table>
            </div>
            <p id="vuoto" class="vuoto" hidden>Nessun voto da mostrare.</p>
        </section>
    </main>
</body>
</html>
