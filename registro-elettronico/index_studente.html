<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Accesso Studenti - RED</title>
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="icon" href="assets/favicon/favicon.ico">
        <script defer src="assets/js/storage.js"></script>
        <script defer src="assets/js/login.js"></script>
    </head>
    <body class="login_alunno">
        <div class="scheda-login">
            <a href="index.html" class="link-back">Cambia profilo</a>
            <div class="ruolo">🎓 Studente</div>
            <h1>Accesso Alunni</h1>
            <p class="sottotitolo">Accedi con le credenziali dello studente.</p>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="studente@mail.it">
            </div>

            <div class="campo">
                <label for="password">Password</label>
                <div class="psw">
                    <input type="password" id="password" name="password" placeholder="Password" onkeydown="invioPassword(event)">
                    <button type="button" class="mostra-psw" id="mostra-psw" onclick="mostraPsw()" aria-label="Mostra password">👁️</button>
                </div>
            </div>

            <div class="riga-opzioni">
                <label class="ricordami" for="btnRicordami">
                    <input type="checkbox" id="btnRicordami" name="ricordami">
                    Ricordami!
                </label>
                <a href="recuper_psw.html" class="link-password">Password dimenticata?</a>
            </div>

            <button type="button" class="btn" onclick="login()">Accedi</button>
            <div id="messaggi" class="messaggi"></div>


            <div class="separatore">oppure</div>
            <div class="accesso-esterno">
                <a class="btn btn-spid" href="https://spid.governo.it/" target="_blank" rel="noopener noreferrer">Entra con SPID</a>
                <a class="btn btn-cie" href="https://idserver.servizicie.interno.gov.it/idp/login/livello2?opId=ID2c2d7368-824e-4b0d-8a24-bee6c2126b3c&challenge=cAsYN9CrjM3ml6B3%2FkbNL%2Fz26apQ19j1VETvJaUb&level=2&SPName=https%3A%2F%2Fspid.anpr.interno.it&SPLogo=https%3A%2F%2Fidserver.servizicie.interno.gov.it%2Fidp%2Fimages%2Fcielogo.png&value=e1s2" target="_blank" rel="noopener noreferrer">Entra con CIE</a>
            </div>

            <p class="nota-demo">
                Credenziali di prova (Studente):<br>
                <strong>studente@mail.it</strong> / <strong>Studente1!</strong>
            </p>
        </div>
    </body>
</html>
