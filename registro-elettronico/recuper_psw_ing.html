<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Recover password - RED</title>
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="icon" href="assets/favicon/favicon.ico">
        <script defer src="assets/js/storage.js"></script>
        <script defer src="assets/js/recupera.js"></script>
    </head>
    <body class="pagina-login">
        <div class="scheda-login">
            <a href="index_ing.html" class="link-back">Back to login</a>
            <h1>Recover password</h1>
            <p class="sottotitolo">Enter your email: we will send you the instructions to change your password.</p>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="nome@mail.it" onkeydown="invioEmail(event)">
            </div>

            <button type="button" class="btn" onclick="recupera()">Send request</button>
            <div id="messaggi" class="messaggi"></div>
        </div>
    </body>
</html>
