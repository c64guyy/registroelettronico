<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accesso Docenti - Registro Elettronico</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico">
    <script defer src="js/dati.js"></script>
    <script defer src="js/validazione.js"></script>
    <script defer src="js/common.js"></script>
    <script defer src="js/cookie.js"></script>
    <script defer src="js/login.js"></script>
</head>
<body class="pagina-login tema-docente" data-ruolo="docente">
    <div class="scheda-login">
        <a href="index.html" class="link-indietro">&larr; Cambia profilo</a>
        <div class="etichetta-ruolo">🧑‍🏫 Docente</div>
        <h1>Accesso Docenti</h1>
        <p class="sottotitolo">Accedi con le credenziali del docente.</p>

        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="docente@scuola.it">
        </div>

        <div class="campo">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Password"
                    onkeydown="if (event.key === 'Enter') login()">
                <button type="button" class="toggle-password" id="togglePassword"
                    onclick="togglePassword()" aria-label="Mostra password">👁️</button>
            </div>
        </div>

        <div class="riga-opzioni">
            <label class="ricordami" for="bottonRico">
                <input type="checkbox" id="bottonRico" name="ricordami">
                Ricordami!
            </label>
            <a href="recupera-password.html" class="link-password">Password dimenticata?</a>
        </div>

        <button type="button" class="btn" onclick="login()">Accedi</button>
        <div id="messaggi" class="messaggi"></div>

        <div class="separatore">oppure</div>
        <div class="accesso-esterno">
            <a class="btn btn-spid" href="https://spid.governo.it/" target="_blank" rel="noopener noreferrer">Entra con SPID</a>
            <a class="btn btn-cie" href="https://idserver.servizicie.interno.gov.it/idp/login/livello2?opId=ID2c2d7368-824e-4b0d-8a24-bee6c2126b3c&challenge=cAsYN9CrjM3ml6B3%2FkbNL%2Fz26apQ19j1VETvJaUb&level=2&SPName=https%3A%2F%2Fspid.anpr.interno.it&SPLogo=https%3A%2F%2Fidserver.servizicie.interno.gov.it%2Fidp%2Fimages%2Fcielogo.png&value=e1s2" target="_blank" rel="noopener noreferrer">Entra con CIE</a>
        </div>

        <p class="nota-demo">
            Credenziali di prova (Docente):<br>
            <strong>docente@scuola.it</strong> / <strong>Docente1!</strong>
        </p>
    </div>
</body>
</html>
