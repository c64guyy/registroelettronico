<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Parent Login - RED </title>
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="icon" href="assets/favicon/favicon.ico">
    </head>
    <body class="login_alunno">
        <div class="scheda-login">
            <a href="index.html" class="link-back">Change profile</a>
            <div class="ruolo">🎓 Student</div>
            <h1>Student Login</h1>
            <p class="sottotitolo">Log in with your student credentials.</p>


            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="firstname.lastname@school.it">
            </div>


            <div class="campo">
                <label for="password">Password</label>
                <div class="psw">
                    <input type="password" id="password" name="password" placeholder="Password" onkeydown="if (event.key() === 'Enter') login()">
                    <button type="button" class="mostra-psw" id="mostra-psw" onclick="mostraPsw()" aria-label="Show password">👁️</button>
                </div>
            </div>


            <div class="riga-opzioni">
                <label class="ricordami" for="btnRicordami">
                    <input type="checkbox" id="btnRicordami" name="ricordami">
                    Remember me!
                </label>
                <a href="recuper_psw.html" class="link-password">Forgot your password?</a>
            </div>


            <button type="button" class="btn" onclick="login()">Log in</button>
            <div id="messaggi" class="messaggi"></div>



            <div class="separatore">or</div>
            <div class="accesso-esterno">
                <a class="btn btn-spid" href="https://spid.governo.it/" target="_blank" rel="noopener noreferrer">Log in with SPID</a>
                <a class="btn btn-cie" href="https://idserver.servizicie.interno.gov.it/idp/login/livello2?opId=ID2c2d7368-824e-4b0d-8a24-bee6c2126b3c&challenge=cAsYN9CrjM3ml6B3%2FkbNL%2Fz26apQ19j1VETvJaUb&level=2&SPName=https%3A%2F%2Fspid.anpr.interno.it&SPLogo=https%3A%2F%2Fidserver.servizicie.interno.gov.it%2Fidp%2Fimages%2Fcielogo.png&value=e1s2" target="_blank" rel="noopener noreferrer">Log in with CIE</a>
            </div>


            <p class="nota-demo">
                Test credentials (Student):<br>
                <strong>giulia.bianchi@mail.it</strong> / <strong>Studente1!</strong>
            </p>
        </div>
    </body>
</html>
